name: Verify and generate UHVI 2019 GeoJSON
on:
  workflow_dispatch:
  push:
    paths:
      - 'UHVI-2019/build.mjs'
      - 'UHVI-2019/compare-geometry.py'
      - '.github/workflows/uhvi-2019.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current WFS and generate UHVI GeoJSON
        run: node UHVI-2019/build.mjs
      - name: Install geometry comparison dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2
      - name: Compare archived and current polygon geometry in meters
        run: python UHVI-2019/compare-geometry.py
      - name: Commit verified dataset to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UHVI-2019/uhvi-2019.geojson UHVI-2019/geometry-comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish UHVI GeoJSON and metric WFS comparison"
            git push
          fi
